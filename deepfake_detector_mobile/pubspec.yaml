name: deepfake_detector
description: "AI-powered deepfake detection mobile app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  
  # Backend & API
  supabase_flutter: ^2.0.0
  dio: ^5.4.0
  http: ^1.1.0
  
  # Media Handling
  image_picker: ^1.0.5
  video_player: ^2.8.1
  file_picker: ^8.1.6
  cached_network_image: ^3.3.0
  
  # UI & Animations
  flutter_animate: ^4.3.0
  shimmer: ^3.0.0
  
  # Storage & Persistence
  shared_preferences: ^2.2.2
  
  # Utilities
  intl: ^0.18.1
  path_provider: ^2.1.1
  mime: ^1.0.4
  
  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/animations/
